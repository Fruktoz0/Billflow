version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billflow_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:5000"
    networks:
      - billflow_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: billflow_frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend
    networks:
      - billflow_network

networks:
  billflow_network:
    driver: bridge
